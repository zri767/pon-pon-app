name: Build APK
on: 
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          pip install flet yt-dlp

      - name: Build APK
        run: |
          # requirements.txt байгаа тохиолдолд Flet тэдгээрийг APK-д багтаадаг
          flet build apk --y --verbose --permissions storage

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
